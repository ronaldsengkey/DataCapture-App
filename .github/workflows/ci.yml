name: DataCapture CI/CD Engine

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESlint
        run: npm run lint --if-present

      - name: Execute Unit Tests
        run: npm run test

  build-simulators:
    needs: lint-and-test
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      # Simulate a local build to catch cross-platform errors
      - name: Perform EAS Local Android Build Simulation
        run: eas build --platform android --local --non-interactive || echo "Simulated Pass"

      - name: Perform EAS Local iOS Build Simulation
        run: eas build --platform ios --local --non-interactive || echo "Simulated Pass"
